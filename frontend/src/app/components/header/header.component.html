<section class="section">
  <nav class="navbar">
    <div class="navbar-container">
      <!-- Logo -->
      <div class="logo">
        <a routerLink="/" class="navbar-logo">
          <img src="assets/images/logo.png" alt="logo" class="logo-image">
        </a>
      </div>

      <!-- Menu principal -->
      <ul class="navbar-list">
        <li class="navbar-item"><a routerLink="/sobre-nos">Sobre nós</a></li>
        <li class="navbar-item"><a routerLink="/#planos">Planos</a></li>
        <li class="navbar-item"><a routerLink="/contato">Contato</a></li>
        <li class="navbar-item"><a routerLink="/tela-personal">Personais</a></li>
      </ul>

      <!-- ✅ Menu de login/cadastro (somente se NÃO estiver logado) -->
      <div class="login-menu" *ngIf="!authService.isLoggedIn()">
        <div class="login-icon">
          <img src="assets/images/user.png" alt="Login">
        </div>
        <div class="login-options">
          <a routerLink="/login-usuario">Login</a>
        </div>
      </div>

      <!-- ✅ Menu de boas-vindas + opções (somente se estiver logado) -->
      <div class="login-menu" *ngIf="authService.isLoggedIn()">
        <div class="login-icon">
          <img src="assets/images/user.png" alt="Usuário">
          <span>Bem-vindo, {{ authService.getUsuarioNome() }}</span>
        </div>
      </div>

      <div class="user-menu" *ngIf="authService.isLoggedIn()">
        <a routerLink="/user/home" class="user-link">
          <span>Área do Usuário</span>
        </a>
        <a routerLink="/admin" class="admin-link" *ngIf="authService.isAdmin()">Administrador</a>
        <button class="btn-logout" (click)="logout()">Sair</button>
      </div>
    </div>
  </nav>
</section>
